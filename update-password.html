<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password - PX By Peniel</title>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1a1a1a;
      padding: 35px 30px;
      border-radius: 12px;
      border: 1px solid #c5a059;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      box-sizing: border-box;
    }
    h2 {
      color: #c5a059;
      text-align: center;
      margin-bottom: 8px;
      font-size: 26px;
      font-weight: 600;
    }
    p.subtitle {
      text-align: center;
      color: #a3a3a3;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .input-group {
      position: relative;
      margin-bottom: 16px;
    }
    input {
      width: 100%;
      padding: 14px 45px 14px 14px;
      background: #262626;
      border: 1px solid #404040;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #c5a059;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #a3a3a3;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      padding: 4px;
    }
    .toggle-password:hover {
      color: #c5a059;
    }
    button.submit-btn {
      width: 100%;
      padding: 14px;
      background: #c5a059;
      color: #000;
      border: none;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 16px;
      transition: background 0.2s, transform 0.1s;
    }
    button.submit-btn:hover {
      background: #d4af37;
    }
    button.submit-btn:active {
      transform: scale(0.98);
    }
    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Update Password</h2>
    <p class="subtitle">Please enter your new secure password below.</p>
    
    <div id="form-container">
      <div class="input-group">
        <input type="password" id="newPassword" placeholder="New Password (min 6 characters)" required>
        <button type="button" id="togglePasswordBtn" class="toggle-password">Show</button>
      </div>
      <button id="updateBtn" class="submit-btn">Save New Password</button>
    </div>
    
    <div id="message"></div>
  </div>

  <script>
    // Initialize Supabase Client (Replace with your actual keys or your shared config)
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const newPasswordInput = document.getElementById('newPassword');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const updateBtn = document.getElementById('updateBtn');
    const messageDiv = document.getElementById('message');

    // Toggle Password Visibility Logic
    togglePasswordBtn.addEventListener('click', () => {
      if (newPasswordInput.type === 'password') {
        newPasswordInput.type = 'text';
        togglePasswordBtn.textContent = 'Hide';
      } else {
        newPasswordInput.type = 'password';
        togglePasswordBtn.textContent = 'Show';
      }
    });

    // Automatically exchange the recovery token hash when the page loads
    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get('token_hash');
      const type = params.get('type');

      if (tokenHash && type === 'recovery') {
        const { error } = await supabaseClient.auth.verifyOtp({
          token_hash: tokenHash,
          type: 'recovery'
        });
        if (error) {
          messageDiv.style.color = '#ff6b6b';
          messageDiv.textContent = 'Invalid or expired reset link. Please request a new one.';
          updateBtn.disabled = true;
        }
      }
    });

    // Handle Password Update Submission
    updateBtn.addEventListener('click', async () => {
      const newPassword = newPasswordInput.value;

      if (!newPassword || newPassword.length < 6) {
        messageDiv.style.color = '#ff6b6b';
        messageDiv.textContent = 'Password must be at least 6 characters long.';
        return;
      }

      updateBtn.disabled = true;
      updateBtn.textContent = 'Updating...';

      const { error } = await supabaseClient.auth.updateUser({
        password: newPassword
      });

      if (error) {
        messageDiv.style.color = '#ff6b6b';
        messageDiv.textContent = error.message;
        updateBtn.disabled = false;
        updateBtn.textContent = 'Save New Password';
      } else {
        messageDiv.style.color = '#51cf66';
        messageDiv.textContent = 'Password updated successfully! Redirecting to login...';
        setTimeout(() => {
          // Redirects back to your login / home page after successful update
          window.location.href = 'index.html'; 
        }, 2000);
      }
    });
  </script>
</body>
</html>
