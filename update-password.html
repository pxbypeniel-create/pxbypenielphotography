<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password - PX By Peniel</title>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at top, #181510 0%, #0a0a0a 70%);
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: rgba(20, 20, 20, 0.95);
      padding: 40px 32px;
      border-radius: 14px;
      border: 1px solid rgba(197, 160, 89, 0.45);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(197, 160, 89, 0.08);
    }
    .brand {
      text-align: center;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c5a059;
      margin-bottom: 10px;
      font-weight: 600;
    }
    h2 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    p.subtitle {
      text-align: center;
      color: #9e9e9e;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 18px;
    }
    input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: #121212;
      border: 1px solid #333333;
      color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    input:focus {
      outline: none;
      border-color: #c5a059;
      box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.15);
    }
    .toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #9e9e9e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      transition: color 0.2s;
    }
    .toggle-btn:hover {
      color: #c5a059;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #d4af37 0%, #b58e43 100%);
      color: #0a0a0a;
      border: none;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.15s;
    }
    .submit-btn:hover {
      opacity: 0.92;
    }
    .submit-btn:active {
      transform: scale(0.99);
    }
    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      min-height: 20px;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #888888;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #c5a059;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">PX By Peniel</div>
    <h2>Set New Password</h2>
    <p class="subtitle">Create a strong new password for your account.</p>
    
    <div id="form-container">
      <div class="input-wrapper">
        <input type="password" id="newPassword" placeholder="New Password (min 6 characters)" required>
        <button type="button" id="togglePassword" class="toggle-btn" aria-label="Toggle password visibility" title="Show/Hide Password">
          <!-- Eye Icon -->
          <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
      <button id="updateBtn" class="submit-btn">Save New Password</button>
    </div>
    
    <div id="message"></div>
    <a href="login.html" class="back-link">← Back to Login</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://kplwvidpctgjwkxsabov.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ggIovP3ZABeeHr-kIyUy7g_f_Vcy_4k';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Change this to 'index.html' if your login form is on your home page
    const LOGIN_PAGE_URL = 'login.html';

    const newPasswordInput = document.getElementById('newPassword');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const updateBtn = document.getElementById('updateBtn');
    const messageDiv = document.getElementById('message');

    // Show / Hide Password Toggle
    togglePasswordBtn.addEventListener('click', () => {
      const isHidden = newPasswordInput.type === 'password';
      newPasswordInput.type = isHidden ? 'text' : 'password';
      
      // Swap between Eye and Eye-Off SVG
      eyeIcon.innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    // Automatically capture and verify the recovery session on page load
    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get('token_hash');
      const type = params.get('type');

      if (tokenHash && type === 'recovery') {
        const { error } = await supabaseClient.auth.verifyOtp({
          token_hash: tokenHash,
          type: 'recovery'
        });
        if (error) {
          messageDiv.style.color = '#ff6b6b';
          messageDiv.textContent = 'Invalid or expired reset link. Please request a new one.';
          updateBtn.disabled = true;
        }
      }
    });

    // Save New Password and Redirect to Login
    updateBtn.addEventListener('click', async () => {
      const newPassword = newPasswordInput.value;

      if (!newPassword || newPassword.length < 6) {
        messageDiv.style.color = '#ff6b6b';
        messageDiv.textContent = 'Password must be at least 6 characters long.';
        return;
      }

      updateBtn.disabled = true;
      updateBtn.textContent = 'Saving...';

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

      if (error) {
        messageDiv.style.color = '#ff6b6b';
        messageDiv.textContent = error.message;
        updateBtn.disabled = false;
        updateBtn.textContent = 'Save New Password';
      } else {
        messageDiv.style.color = '#51cf66';
        messageDiv.textContent = 'Password updated successfully! Redirecting to login...';
        setTimeout(() => {
          window.location.href = LOGIN_PAGE_URL;
        }, 2000);
      }
    });
  </script>
</body>
</html>
